{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <h2 class="mb-4 fw-bold">Supported Portals & Job Records</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" style="width: 10%">Sr. No.</th>
                        <th scope="col" style="width: 45%">Job Notification Title</th>
                        <th scope="col" style="width: 25%">Department</th>
                        <th scope="col" style="width: 20%">Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for job in jobs %}
                    <tr>
                        <th scope="row">{{ loop.index }}</th>
                        <td class="fw-semibold text-dark">{{ job.title }}</td>
                        <td>{{ job.dept }}</td>
                        <td><span class="badge {{ job.badge_class }} px-2 py-1.5">{{ job.status }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
